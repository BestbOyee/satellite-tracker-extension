<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 210px;
      padding: 14px;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }
    h3 {
      font-size: 13px;
      margin: 0 0 10px 0;
      color: #58a6ff;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      background-color: #21262d;
      color: #f0f6fc;
      border: 1px solid #30363d;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #30363d;
    }
  </style>
</head>
<body>
  <h3>🛰️ Mission Control Settings</h3>
  <button id="toggle-override">Disable Custom New Tab</button>
  <script src="popup.js"></script>
</body>
</html>
